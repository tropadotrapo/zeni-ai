<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09090D">
    <meta name="description" content="Entre ou crie sua conta ZENI AI.">
    <title>Entrar · ZENI AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v=zeni-chat-1">
  </head>
  <body class="auth-page">
    <header class="auth-header">
      <a class="brand" href="/" aria-label="ZENI AI, voltar ao chat">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-name">ZENI<span>AI</span></span>
      </a>
      <a href="/">Voltar ao chat</a>
    </header>
    <main class="auth-main">
      <section class="auth-card">
        <span class="plans-eyebrow">SUA CONTA ZENI</span>
        <h1 id="authHeading">Entre na sua conta</h1>
        <p id="authDescription">Acesse suas conversas, seu plano e continue de onde parou.</p>
        <form class="auth-form" id="authForm">
          <label id="nameField" hidden>
            Nome
            <input id="authName" name="name" type="text" maxlength="80" autocomplete="name">
          </label>
          <label>
            E-mail
            <input id="authEmail" name="email" type="email" maxlength="254" autocomplete="email" required>
          </label>
          <label>
            Senha
            <input id="authPassword" name="password" type="password" maxlength="128" autocomplete="current-password" required>
          </label>
          <button class="pricing-button pricing-button-primary" id="authSubmit" type="submit">Entrar</button>
        </form>
        <div class="auth-switch">
          <span id="authSwitchText">Ainda não tem uma conta?</span>
          <button id="authSwitchButton" type="button">Criar conta</button>
        </div>
        <div class="migration-area" id="migrationArea" hidden>
          <p>Já tem uma conta criada anteriormente? Acesse-a para definir uma senha e migrar seu histórico.</p>
          <a class="migration-link" href="/auth/google/start">Acessar conta existente para migração</a>
        </div>
        <div class="plans-feedback" id="authFeedback" role="status" aria-live="polite" hidden></div>
      </section>
    </main>
    <script src="/auth.js?v=zeni-chat-1" defer></script>
  </body>
</html>
